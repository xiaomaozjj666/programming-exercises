name: CI

on:
  push:
    branches: [main]
  pull_request:

# 仅对 PR 取消旧运行（PR 分支会反复推送，取消可避免排队）；
# 推送默认分支不取消——公开仓库的 Actions 分钟数免费，取消节省不了额度，
# 反而会让被顶掉的那次运行在提交列表里留下红色的 cancelled 标记。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 最小权限：CI 只读仓库内容
permissions:
  contents: read

jobs:
  build:
    name: Compile & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Compile C examples
        run: |
          gcc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/c_hello" c/hello.c
          gcc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/c_char" c/char_counter.c

      - name: Compile C++ examples
        run: |
          g++ -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/cpp_hello" cpp/hello.cpp
          g++ -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/cpp_base" cpp/base_converter.cpp

      - name: Check JavaScript syntax
        run: |
          node --check js/hello.js
          node --check js/base_converter.js

      - name: Compile Python examples
        run: |
          python -m py_compile python/hello.py
          python -m py_compile python/base_converter.py

      - name: Run base converters (--test)
        run: |
          "$RUNNER_TEMP/cpp_base" --test
          node js/base_converter.js --test
          python python/base_converter.py --test

      - name: Starter template (compile + real tests)
        run: |
          gcc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/st_c" starter-template/src/main.c
          g++ -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/st_cpp" starter-template/src/main.cpp
          node --check starter-template/src/index.js
          python -m py_compile starter-template/src/main.py
          python -m unittest discover -s starter-template/tests -v

      - name: CLI error semantics agree across three languages
        run: |
          # README 承诺"错误语义三语一致"：进制参数必须严格解析，
          # 0x10 / 16.0 / 1e1 / 1_6 / 16abc / 前导空格一律拒绝（退出码 2）。
          # 此前 JS 的 Number() 接受 0x10/1e1、C++ 的 strtol 接受 16abc、
          # Python 的 int() 接受 1_6——三处已分别修复，此步骤锁定行为。
          reject() {
            if "$@" > /dev/null 2>&1; then
              echo "UNEXPECTED SUCCESS (want exit 2): $*" >&2; exit 1;
            fi
          }
          PY=python/base_converter.py
          JS=js/base_converter.js
          CPP="$RUNNER_TEMP/cpp_base"
          reject python3 "$PY" 255 0x10 2
          reject python3 "$PY" 255 16.0 2
          reject python3 "$PY" 255 1_6 2
          reject python3 "$PY" 255 " 16" 2
          reject node "$JS" 255 0x10 2
          reject node "$JS" 255 16.0 2
          reject node "$JS" 255 1e1 2
          reject node "$JS" 255 " 16" 2
          reject "$CPP" 255 0x10 2
          reject "$CPP" 255 16.0 2
          reject "$CPP" 255 16abc 2
          reject "$CPP" 255 " 16" 2
          # 合法参数的 CLI 冒烟：三语输出必须一致（255 十进制 → 十六进制 FF）
          [ "$(python3 "$PY" 255 10 16)" = "FF" ]
          [ "$(node "$JS" 255 10 16)" = "FF" ]
          [ "$("$CPP" 255 10 16)" = "FF" ]
          echo "CLI error semantics: 3 languages x 4 bad inputs + happy path OK"

      - name: Algorithm benchmark (compile + tests)
        run: |
          g++ -O2 -std=c++11 -Wall -Wextra benchmark/benchmark.cpp -o "$RUNNER_TEMP/benchmark"
          "$RUNNER_TEMP/benchmark" > "$RUNNER_TEMP/cpp_bench.txt"
          if grep -q FAIL "$RUNNER_TEMP/cpp_bench.txt"; then cat "$RUNNER_TEMP/cpp_bench.txt"; exit 1; fi
          n=$(grep -c PASS "$RUNNER_TEMP/cpp_bench.txt")
          echo "C++ benchmark PASS count: $n"
          [ "$n" -ge 23 ] || { echo "expected >=23 PASS, got $n"; exit 1; }
          python benchmark/benchmark.py --test | tee "$RUNNER_TEMP/py_bench.txt"
          if grep -q FAIL "$RUNNER_TEMP/py_bench.txt"; then exit 1; fi
          node benchmark/benchmark.js | tee "$RUNNER_TEMP/js_bench.txt"
          if grep -q FAIL "$RUNNER_TEMP/js_bench.txt"; then exit 1; fi
          p=$(grep -c PASS "$RUNNER_TEMP/py_bench.txt")
          j=$(grep -c PASS "$RUNNER_TEMP/js_bench.txt")
          echo "Python benchmark PASS count: $p / JS: $j"
          [ "$p" -ge 23 ] && [ "$j" -ge 23 ] || { echo "expected >=23 PASS each, got py=$p js=$j"; exit 1; }
